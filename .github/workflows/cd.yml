on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build Production Binary
        run: ./scripts/buildprod.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup GCP SDK
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Use gcloud cli
        run: gcloud info

      - name: Build & Push Docker image and push to GCP Artifact Registry
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-431916/notely-ar-repo/timenglesf/notely:latest .

      - name: migrate db
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/notely-431916/notely-ar-repo/timenglesf/notely:latest \
            --region us-central1 \
            --allow-unauthenticated \
            --project notely-431916 \
            --max-instances=4 \
            --set-env-vars DBHOST=${{ vars.DBHOST }},DBPORT=${{ vars.DBPORT }},DBNAME=${{ vars.DBNAME }},DBUSER=${{ secrets.DBUSER }},DBPASSWORD=${{ secrets.DBPASSWORD }}jobs:
